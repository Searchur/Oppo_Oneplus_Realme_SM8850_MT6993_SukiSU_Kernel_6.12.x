name: 编译所有网卡

on:
  workflow_dispatch:

jobs:
  build-modules:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y git wget unzip make gcc flex bison bc \
            libssl-dev libelf-dev libdwarf-dev

      - name: 下载内核源码
        run: |
          wget -O common.zip https://github.com/cctv18/android_kernel_common_oneplus_sm8845/archive/refs/heads/oneplus/sm8845_b_16.0.0_ace_6t.zip
          unzip common.zip
          mv android_kernel_common_oneplus_sm8845-oneplus-sm8845_b_16.0.0_ace_6t common

      - name: 下载 Clang 工具链
        run: |
          mkdir -p clang
          wget -O clang.zip https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip
          unzip clang.zip -d clang
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

      - name: 配置内核
        run: |
          cd common
          export ARCH=arm64
          export LLVM=1
          export PATH=${{ github.workspace }}/clang/bin:$PATH

          make gki_defconfig

          cat >> .config << 'EOF'
          CONFIG_GENDWARFKSYMS=n
          CONFIG_CFG80211=m
          CONFIG_CFG80211_WEXT=y
          CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=y
          CONFIG_CFG80211_USE_KERNEL_REGDB_KEYS=y
          CONFIG_CFG80211_DEFAULT_PS=y
          CONFIG_CFG80211_CRDA_SUPPORT=y
          CONFIG_MAC80211=m
          CONFIG_MAC80211_LEDS=y
          CONFIG_WLAN=y
          CONFIG_MODULES=y
          CONFIG_ATH_COMMON=m
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_BTCOEX_SUPPORT=y
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH6KL=m
          CONFIG_ATH6KL_USB=m
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=m
          CONFIG_RT2500USB=m
          CONFIG_RT73USB=m
          CONFIG_RT2800USB=m
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          CONFIG_RT2800_LIB=m
          CONFIG_RT2X00_LIB_USB=m
          CONFIG_RT2X00_LIB=m
          CONFIG_RT2X00_LIB_FIRMWARE=y
          CONFIG_RT2X00_LIB_CRYPTO=y
          CONFIG_RT2X00_LIB_LEDS=y
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL_CARDS=m
          CONFIG_RTL8187=m
          CONFIG_RTL8187_LEDS=y
          CONFIG_RTL8192CU=m
          CONFIG_RTLWIFI=m
          CONFIG_RTLWIFI_USB=m
          CONFIG_RTLWIFI_DEBUG=y
          CONFIG_RTL8192C_COMMON=m
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_WLAN_VENDOR_ATMEL=y
          CONFIG_WLAN_VENDOR_MICROCHIP=y
          CONFIG_WLAN_VENDOR_PURELIFI=y
          CONFIG_WLAN_VENDOR_SILABS=y
          CONFIG_WLAN_VENDOR_ZYDAS=y
          CONFIG_CRYPTO_LIB_ARC4=m
          EOF

          make olddefconfig

      - name: 准备模块编译环境
        run: |
          cd common
          export ARCH=arm64
          export LLVM=1
          export PATH=${{ github.workspace }}/clang/bin:$PATH

          make modules_prepare

      - name: 编译所有网卡驱动
        run: |
          cd common
          export ARCH=arm64
          export LLVM=1
          export PATH=${{ github.workspace }}/clang/bin:$PATH

          echo "编译 Ralink 驱动 (RT5572)..."
          make -j$(nproc) M=drivers/net/wireless/ralink modules

          echo "编译 Atheros 驱动..."
          make -j$(nproc) M=drivers/net/wireless/ath modules

          echo "编译 Realtek 驱动..."
          make -j$(nproc) M=drivers/net/wireless/realtek modules

          echo "编译 MediaTek 驱动..."
          make -j$(nproc) M=drivers/net/wireless/mediatek modules

          echo "编译 Broadcom 驱动..."
          make -j$(nproc) M=drivers/net/wireless/broadcom modules || true

          echo "编译 Intel 驱动..."
          make -j$(nproc) M=drivers/net/wireless/intel modules || true

          echo "编译 Marvell 驱动..."
          make -j$(nproc) M=drivers/net/wireless/marvell modules || true

      - name: 收集模块
        run: |
          cd common
          mkdir -p modules
          find . -name "*.ko" -exec cp {} modules/ \;
          MODULE_COUNT=$(ls -1 modules/*.ko 2>/dev/null | wc -l)
          echo "共生成 $MODULE_COUNT 个模块"

          if [ $MODULE_COUNT -eq 0 ]; then
            echo "错误：没有生成任何模块"
            exit 1
          fi

          zip -r ../all_wifi_modules.zip modules/

      - name: 上传模块包
        uses: actions/upload-artifact@v4
        with:
          name: all-wifi-modules
          path: all_wifi_modules.zip
